<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:24px 32px; }
  .label { font:var(--label-small); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .console { background:var(--console-bg); border-radius:var(--radius-md); padding:16px 18px; font:var(--code-medium); color:var(--console-fg); white-space:pre-wrap; border-left:3px solid var(--marine-60); box-shadow:var(--elevation-2); }
  .console .route { color:var(--marine-70); font-weight:700; }
  .console .ok { color:#7fe0a3; }
  .console .dim { color:#6f8296; }
</style></head>
<body>
  <div class="label">Console output — the one dark surface</div>
  <div class="console"><span class="dim">spring-ai@demo:~/features$</span> ./route.sh
<span class="route">→ Route:</span> tool_calling

Aktuell sind <span class="ok">42 Monitore</span> auf Lager.
<span class="dim">latency 1.24s · 318 tokens</span></div>
</body></html>
