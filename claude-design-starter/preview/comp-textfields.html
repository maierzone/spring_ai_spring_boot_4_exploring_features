<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1" />
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:28px 32px; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  label { display:block; font:var(--code-small); color:var(--muted); margin-bottom:6px; }
  .material-symbols-rounded { font-size:20px; color:var(--primary); }
  .filled-field { display:flex; align-items:center; gap:10px; background:var(--surface-container-high); border:0; border-bottom:2px solid var(--outline); border-radius:var(--radius-sm) var(--radius-sm) 0 0; padding:12px 14px; font:var(--code-medium); color:var(--on-surface); }
  .out-field { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--outline); border-radius:var(--radius-sm); padding:12px 14px; font:var(--code-medium); color:var(--on-surface); }
  .out-field.focus { border:2px solid var(--primary); box-shadow:0 0 0 3px var(--marine-90); padding:11px 13px; }
  .filled-field.focus { border-bottom:2px solid var(--primary); }
  .ph { color:var(--neutral-50); }
</style></head>
<body>
  <div><label>Filled · default</label><div class="filled-field"><span class="material-symbols-rounded">chat</span><span class="ph">Frage eingeben…</span></div></div>
  <div><label>Filled · focused</label><div class="filled-field focus"><span class="material-symbols-rounded">chat</span>Wie viele Monitore?</div></div>
  <div><label>Outlined · default</label><div class="out-field"><span class="material-symbols-rounded">manage_search</span><span class="ph">Was ist RAG?</span></div></div>
  <div><label>Outlined · focused</label><div class="out-field focus"><span class="material-symbols-rounded">manage_search</span>Was ist Tool Calling?</div></div>
</body></html>
