<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--background); font-family:var(--font-sans); padding:26px 32px; }
  .label { font:var(--label-small); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .sw { height:74px; border-radius:var(--radius-sm); box-shadow:inset 0 0 0 1px var(--outline-variant); display:flex; align-items:flex-end; padding:8px; font:var(--code-small); color:var(--on-surface-variant); }
</style></head>
<body>
  <div class="label">Surface roles — background &amp; container tiers</div>
  <div class="grid">
    <div class="sw" style="background:var(--background)">background</div>
    <div class="sw" style="background:var(--surface-container-low)">cont-low</div>
    <div class="sw" style="background:var(--surface-container)">container</div>
    <div class="sw" style="background:var(--surface-container-high)">cont-high</div>
    <div class="sw" style="background:var(--surface);box-shadow:var(--elevation-1)">surface</div>
  </div>
</body></html>
