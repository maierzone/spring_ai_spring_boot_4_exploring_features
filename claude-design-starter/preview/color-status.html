<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:26px 32px; }
  .label { font:var(--label-small); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .pair { border-radius:var(--radius-sm); overflow:hidden; box-shadow:var(--elevation-1); }
  .top { height:54px; display:flex; align-items:center; padding:0 12px; font:var(--label-medium); }
  .bot { height:24px; display:flex; align-items:center; padding:0 12px; font:var(--code-small); }
</style></head>
<body>
  <div class="label">Semantic roles · status</div>
  <div class="grid">
    <div class="pair"><div class="top" style="background:var(--error);color:var(--on-error)">Error</div><div class="bot" style="background:var(--error-container);color:var(--on-error-container)">container</div></div>
    <div class="pair"><div class="top" style="background:var(--success);color:#fff">Success</div><div class="bot" style="background:var(--success-container);color:var(--on-success-container)">container</div></div>
    <div class="pair"><div class="top" style="background:var(--warning);color:#fff">Warning</div><div class="bot" style="background:var(--warning-container);color:var(--on-warning-container)">container</div></div>
    <div class="pair"><div class="top" style="background:var(--info);color:#fff">Info</div><div class="bot" style="background:var(--info-container);color:#06343f">container</div></div>
  </div>
</body></html>
