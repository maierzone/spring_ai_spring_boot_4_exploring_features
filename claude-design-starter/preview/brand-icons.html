<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1" />
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:26px 32px; }
  .label { font:var(--label-small); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:18px; }
  .grid { display:flex; gap:26px; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--on-surface-variant); }
  .material-symbols-rounded { font-size:30px; font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24; }
  .cap { font:var(--code-small); color:var(--muted); }
</style></head>
<body>
  <div class="label">Material Symbols — Rounded · wght 400</div>
  <div class="grid">
    <div class="item"><span class="material-symbols-rounded">hub</span><span class="cap">hub</span></div>
    <div class="item"><span class="material-symbols-rounded">account_tree</span><span class="cap">structured</span></div>
    <div class="item"><span class="material-symbols-rounded">construction</span><span class="cap">tools</span></div>
    <div class="item"><span class="material-symbols-rounded">manage_search</span><span class="cap">rag</span></div>
    <div class="item"><span class="material-symbols-rounded">database</span><span class="cap">db</span></div>
    <div class="item"><span class="material-symbols-rounded">memory</span><span class="cap">memory</span></div>
    <div class="item"><span class="material-symbols-rounded">bolt</span><span class="cap">stream</span></div>
    <div class="item"><span class="material-symbols-rounded">terminal</span><span class="cap">console</span></div>
    <div class="item"><span class="material-symbols-rounded">psychology</span><span class="cap">model</span></div>
  </div>
</body></html>
