<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1" />
<style>
  body { margin:0; background:var(--background); font-family:var(--font-sans); padding:34px 32px; display:flex; justify-content:center; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .badge { width:48px; height:48px; border-radius:var(--radius-md); background:var(--primary); color:#fff; display:grid; place-items:center; box-shadow:var(--elevation-2); }
  .badge .material-symbols-rounded { font-size:28px; font-variation-settings:'FILL' 1,'wght' 500; }
  .word { font:var(--headline-medium); letter-spacing:-.02em; }
  .word .accent { color:var(--primary); }
</style></head>
<body>
  <div class="lockup">
    <div class="badge"><span class="material-symbols-rounded">terminal</span></div>
    <div class="word">Spring AI <span class="accent">Console</span></div>
  </div>
</body></html>
