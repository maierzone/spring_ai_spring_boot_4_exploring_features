<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:28px 32px; }
  .label { font:var(--label-small); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:18px; }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { background:var(--primary); }
  .cap { font:var(--code-small); color:var(--muted); }
</style></head>
<body>
  <div class="label">Spacing — 4px base grid</div>
  <div class="row">
    <div class="item"><div class="box" style="width:4px;height:4px"></div><div class="cap">4</div></div>
    <div class="item"><div class="box" style="width:8px;height:8px"></div><div class="cap">8</div></div>
    <div class="item"><div class="box" style="width:12px;height:12px"></div><div class="cap">12</div></div>
    <div class="item"><div class="box" style="width:16px;height:16px"></div><div class="cap">16</div></div>
    <div class="item"><div class="box" style="width:24px;height:24px"></div><div class="cap">24</div></div>
    <div class="item"><div class="box" style="width:32px;height:32px"></div><div class="cap">32</div></div>
    <div class="item"><div class="box" style="width:48px;height:48px"></div><div class="cap">48</div></div>
    <div class="item"><div class="box" style="width:64px;height:64px"></div><div class="cap">64</div></div>
  </div>
</body></html>
