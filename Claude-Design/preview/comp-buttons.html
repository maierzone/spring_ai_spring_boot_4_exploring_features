<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1" />
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:30px 32px; display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .material-symbols-rounded { font-size:18px; font-variation-settings:'wght' 500; }
  .btn { display:inline-flex; align-items:center; gap:8px; font:var(--label-large); border-radius:var(--radius-full); padding:10px 22px; border:0; cursor:pointer; transition:box-shadow var(--dur-short) var(--ease-standard); }
  .filled { background:var(--primary); color:var(--on-primary); box-shadow:var(--elevation-1); }
  .filled:hover { box-shadow:var(--elevation-2); background:var(--marine-30); }
  .tonal { background:var(--primary-container); color:var(--on-primary-container); }
  .tonal:hover { box-shadow:var(--elevation-1); }
  .outlined { background:transparent; color:var(--primary); border:1px solid var(--outline); }
  .outlined:hover { background:rgba(27,77,137,.08); }
  .text { background:transparent; color:var(--primary); padding:10px 14px; }
  .text:hover { background:rgba(27,77,137,.08); }
  .disabled { background:var(--neutral-95); color:var(--neutral-60); cursor:not-allowed; box-shadow:none; }
  .lab { font:var(--code-small); color:var(--muted); width:78px; }
</style></head>
<body>
  <div class="row"><span class="lab">Filled</span><button class="btn filled"><span class="material-symbols-rounded">bolt</span>analyze</button><button class="btn tonal">sources</button><button class="btn outlined">cancel</button><button class="btn text">reset</button></div>
  <div class="row"><span class="lab">States</span><button class="btn filled">default</button><button class="btn filled" style="box-shadow:var(--elevation-2);background:var(--marine-30)">hover</button><button class="btn disabled">disabled</button></div>
</body></html>
