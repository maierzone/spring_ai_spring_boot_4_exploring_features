<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1" />
<style>
  body { margin:0; background:var(--surface); font-family:var(--font-sans); padding:28px 32px; display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .lab { font:var(--code-small); color:var(--muted); width:80px; }
  .material-symbols-rounded { font-size:16px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font:var(--label-medium); border-radius:var(--radius-sm); padding:7px 12px; border:1px solid var(--outline); color:var(--on-surface-variant); background:var(--surface); }
  .chip.sel { background:var(--primary-container); border-color:transparent; color:var(--on-primary-container); }
  .badge { display:inline-flex; align-items:center; font:var(--label-medium); font-family:var(--font-mono); border-radius:var(--radius-xs); padding:5px 11px; color:#fff; }
</style></head>
<body>
  <div class="row"><span class="lab">Chips</span>
    <span class="chip sel"><span class="material-symbols-rounded">done</span>RAG</span>
    <span class="chip">Tool Calling</span>
    <span class="chip">Memory</span>
    <span class="chip">Streaming</span>
  </div>
  <div class="row"><span class="lab">Badges</span>
    <span class="badge" style="background:#ef4444">BUG</span>
    <span class="badge" style="background:#3b82f6">FEATURE_REQUEST</span>
    <span class="badge" style="background:#a855f7">QUESTION</span>
    <span class="badge" style="background:#f59e0b">BILLING</span>
    <span class="badge" style="background:#64748b">OTHER</span>
  </div>
</body></html>
