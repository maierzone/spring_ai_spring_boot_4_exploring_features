# ============================================================================
# Test-Profil (Feature 17): offline ohne Docker
# ----------------------------------------------------------------------------
# Aktiviert via @ActiveProfiles("test") auf den Voll-Kontext-Tests. Diese Datei
# ueberlagert application.properties additiv (kein Ersatz).
#
# In den Tests gibt es kein PostgreSQL. Die pgvector-Autokonfiguration wuerde
# sonst eine zweite Bean 'vectorStore' beisteuern und mit dem offline
# SimpleVectorStore (DemoBeans, @Profile("!postgres")) kollidieren. Daher hier
# ausgeschlossen -> der SimpleVectorStore bleibt der einzige VectorStore.
# ============================================================================
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
