# ============================================================================
# Default-Profil: H2 embedded, kein Docker, kein pgvector
# ----------------------------------------------------------------------------
# Wird NUR geladen, wenn kein anderes Profil explizit gesetzt ist
# (d.h. 'mvn spring-boot:run' ohne -Dspring-boot.run.profiles).
# Mit dem Profil 'postgres' ist stattdessen application-postgres.properties
# aktiv; mit 'test' greift application-test.properties.
# ============================================================================
spring.application.name=spring-ai-demo
# Docker Compose nicht starten: H2 braucht keinen Container.
spring.docker.compose.enabled=false

# PgVectorStore-Autokonfiguration ausschliessen: gegen H2 wuerde sie scheitern,
# weil die Extension 'vector' fehlt. SimpleVectorStore (DemoBeans) uebernimmt.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
