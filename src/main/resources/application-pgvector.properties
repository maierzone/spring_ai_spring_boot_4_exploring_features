# ============================================================================
# Feature 17 - pgvector: Konfiguration des persistenten VectorStore
# ----------------------------------------------------------------------------
# Wird nur geladen, wenn das Profil 'pgvector' aktiv ist (Standardlaufzeit,
# siehe application.properties). In den Tests (@ActiveProfiles("test")) bleibt
# diese Datei aussen vor und der SimpleVectorStore uebernimmt.
# ============================================================================

# Schema automatisch anlegen: CREATE EXTENSION vector, Tabelle 'vector_store'
# und der Vektor-Index werden beim Start erzeugt, falls noch nicht vorhanden.
spring.ai.vectorstore.pgvector.initialize-schema=true

# Vektordimension MUSS zur EmbeddingModel-Ausgabe passen. Das offline
# HashingEmbeddingModel liefert 256-dimensionale Vektoren.
spring.ai.vectorstore.pgvector.dimensions=256

# HNSW-Index + Kosinus-Distanz. Die Embeddings sind L2-normalisiert, daher ist
# Kosinus die natuerliche Metrik (konsistent zum SimpleVectorStore der Tests).
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
