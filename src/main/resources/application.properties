spring.application.name=spring-ai-demo
spring.main.allow-bean-definition-overriding=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:demo-key-not-configured}
spring.ai.anthropic.base-url=https://api.anthropic.com

spring.ai.anthropic.chat.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.temperature=0.7

spring.ai.model.embedding=none
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-egk.sql,classpath:schema-downloads.sql,classpath:schema-triage.sql

# Feature 16 (Tool Calling Expert): Kontakt-Mail fuer den OpenAlex/Unpaywall
# "polite pool" (schnellere, stabilere Antworten). Leer = anonymer Zugriff.
app.openalex.mailto=alexander@maierzone.de

spring.ai.mcp.server.name=spring-ai-demo-inventory
spring.ai.mcp.server.version=0.0.1

management.endpoints.web.exposure.include=health,info,metrics

# spring-ai/java werden beim Maven-Build aus der pom.xml gefiltert (@...@);
# der VersionInfoContributor reicht sie zusammen mit der zur Laufzeit
# ermittelten Spring-Boot-Version unter /actuator/info (versions.*) durch.
info.versions.spring-ai=@spring-ai.version@
info.versions.java=@java.version@

spring.web.error.include-message=always
spring.web.error.include-exception=true
# Bei Bedarf zum Debuggen aktivieren:
#   spring.ai.chat.client.observations.log-prompt=true
