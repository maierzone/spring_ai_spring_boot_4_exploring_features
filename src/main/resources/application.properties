# ============================================================================
# Spring AI Demo - Konfiguration
# ============================================================================

spring.application.name=spring-ai-demo

# --- Vektorspeicher: Profil-Switch (Feature 17) -----------------------------
# Standardlaufzeit verwendet pgvector als persistenten VectorStore. Das Profil
# 'pgvector' aktiviert die PgVectorStore-Autokonfiguration und deaktiviert die
# In-Memory-Bean (SimpleVectorStore) in DemoBeans (@Profile("!pgvector")).
# Voraussetzung ist die via compose.yaml gestartete PostgreSQL (pgvector-Image).
#
# Die Tests ueberschreiben dies mit @ActiveProfiles("test"): dort bleibt der
# offline SimpleVectorStore auf H2 aktiv, pgvector tritt zurueck -> kein Docker.
spring.profiles.active=pgvector

# --- Anthropic / Claude -----------------------------------------------------
# API-Key wird aus der Umgebungsvariable ANTHROPIC_API_KEY gelesen. Ist sie
# nicht gesetzt (z.B. in CI), greift der Platzhalter: die Beans starten dann
# zwar, ein echter Modellaufruf wuerde aber mit 401 fehlschlagen. Die Tests
# rufen das Modell nicht real auf (Logik-Tests bzw. gemocktes ChatModel).
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:demo-key-not-configured}

# Standard-Chat-Modell. Bei Bedarf auf ein im eigenen Account verfuegbares
# Claude-Modell anpassen.
spring.ai.anthropic.chat.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.temperature=0.7

# Multipart-Uploads (Feature 9: Multimodalitaet)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Datenbank / Persistenz -------------------------------------------------
# Die DataSource wird zur Laufzeit von 'spring-boot-docker-compose' aus
# compose.yaml verdrahtet (PostgreSQL). In den Tests nutzt Spring Boot eine
# eingebettete H2-DB. Daher hier KEINE feste JDBC-URL.
#
# Schema fuer das persistente Chat-Memory (Feature 5/B): immer initialisieren,
# damit die Tabellen auch auf PostgreSQL (nicht-embedded) angelegt werden.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
# Eigene Schemata auf jeder DB ausfuehren: tickets (Feature E) und die
# eGK-/Gesundheits-/PKI-Tabellen des Testdaten-Generators. Sobald
# schema-locations explizit gesetzt ist, werden NUR diese Dateien geladen,
# daher schema.sql hier mit auflisten.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-egk.sql

# --- Feature 11: MCP-Server -------------------------------------------------
# Diese App laeuft zugleich als MCP-Server: die ToolCallbackProvider-Bean aus
# McpServerConfig wird ueber den WebMVC/SSE-Transport veroeffentlicht. Name und
# Version erscheinen im Handshake beim verbindenden Client.
spring.ai.mcp.server.name=spring-ai-demo-inventory
spring.ai.mcp.server.version=0.0.1

# --- Feature 11: MCP-Client (Standard: aus) ---------------------------------
# Standardmaessig ist KEIN externer MCP-Server konfiguriert -> der Client bleibt
# inert (CI-/offline-sicher). Zum Ausprobieren eines Loopbacks auf den eigenen
# Server obige Zeilen einkommentieren (App muss laufen):
#   spring.ai.mcp.client.sse.connections.self.url=http://localhost:8080

# --- Feature 12: Observability ----------------------------------------------
# Actuator-Endpunkte fuer Health und Metriken freigeben. Unter
# /actuator/metrics/gen_ai.client.token.usage erscheint nach dem ersten
# Modellaufruf der Token-Verbrauch.
management.endpoints.web.exposure.include=health,info,metrics
# Prompt-/Completion-Inhalte standardmaessig NICHT exportieren (Datenschutz).
# Bei Bedarf zum Debuggen aktivieren:
#   spring.ai.chat.client.observations.log-prompt=true
