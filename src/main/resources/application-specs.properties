# ============================================================================
# Profil 'specs': lokale gematik-Spec-RAG
# ----------------------------------------------------------------------------
# Echtes semantisches RAG ueber die unter src/main/resources/specs/ abgelegten
# Spec-PDFs (nicht eingecheckt, nur fuer lokale Laeufe). Aktivieren mit:
#   mvnd spring-boot:run -Dspring-boot.run.profiles=specs
#
# Unterschiede zum Default-/postgres-Profil:
#   * echtes ONNX-Embedding (all-MiniLM-L6-v2, 384-dim) statt Hashing-Modell
#   * persistenter PgVectorStore (pgvector) statt SimpleVectorStore
#   * SpecIngestionService liest die PDFs beim Start ein (idempotent)
#
# Voraussetzung: laufende Docker-Engine (pgvector-Container via compose.yaml).
# ============================================================================

# --- Embedding: lokales, multilinguales ONNX-Transformer-Modell ------------
# Aktiviert die spring-ai-starter-model-transformers-Autokonfiguration explizit.
# (Ausserhalb dieses Profils stellt DemoBeans das HashingEmbeddingModel bereit,
# wodurch die Autokonfiguration per @ConditionalOnMissingBean zurueckweicht und
# in CI/Tests KEIN Modell geladen wird.)
spring.ai.model.embedding=transformers
# Standardmodell (all-MiniLM-L6-v2) ist englisch-zentriert und trifft deutschen
# Fachtext schlecht. Daher ein MULTILINGUALES Modell (paraphrase-multilingual-
# MiniLM-L12-v2, ebenfalls 384-dim, Mean-Pooling). Quantisierte ONNX-Variante
# (~113 MB) wird beim ersten Start einmalig geladen und lokal gecacht.
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json

# --- Datenbank: PostgreSQL mit pgvector via Docker Compose ------------------
spring.docker.compose.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5432/springai
spring.datasource.username=springai
spring.datasource.password=springai

# --- pgvector als persistenter VectorStore ---------------------------------
spring.ai.vectorstore.pgvector.initialize-schema=true
# Eigene Tabelle fuer die Spec-RAG: die 384-dim ONNX-Vektoren duerfen NICHT in
# derselben Tabelle wie die 256-dim Hashing-Vektoren des Feature-17-Demos
# (Standardtabelle 'vector_store') liegen - pgvector erzwingt eine feste
# Dimension pro Tabelle.
spring.ai.vectorstore.pgvector.table-name=spec_vector_store
# Dimension MUSS zur Embedding-Ausgabe passen: all-MiniLM-L6-v2 liefert 384.
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
