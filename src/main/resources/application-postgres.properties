# ============================================================================
# Profil 'postgres': PostgreSQL via Docker Compose + pgvector VectorStore
# ----------------------------------------------------------------------------
# Aktivieren mit:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# ============================================================================

# Docker Compose beim Start hochfahren (stoppt nach App-Ende automatisch).
spring.docker.compose.enabled=true

# Explizite DataSource-URL (Werte aus compose.yaml).
# Durch das explizite Setzen von spring.datasource.url wird die H2-Embedded-
# Autokonfiguration deaktiviert. Ist Docker aktiv, ueberschreibt
# spring-boot-docker-compose diese URL mit den entdeckten Container-Werten.
# Laeuft Docker nicht, schlaegt die Verbindung mit "Connection refused" fehl.
spring.datasource.url=jdbc:postgresql://localhost:5432/springai
spring.datasource.username=springai
spring.datasource.password=springai

# Schema automatisch anlegen: CREATE EXTENSION vector, Tabelle 'vector_store'
# und der Vektor-Index werden beim Start erzeugt, falls noch nicht vorhanden.
spring.ai.vectorstore.pgvector.initialize-schema=true

# Vektordimension MUSS zur EmbeddingModel-Ausgabe passen.
spring.ai.vectorstore.pgvector.dimensions=256
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
